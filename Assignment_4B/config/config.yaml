# All paths are relative to the project root directory.

# Sample sheet with at least the columns: sample, fq1, fq2
samples: "config/samples.tsv"

# Reference genome FASTA used for reference-based assembly and coordinate-aware variability interpretation.
ref: "resources/reference/adenovirus_reference.fasta"

# Which assembly should be used for alignment, phylogeny and variability analysis?
# Allowed values: "reference" or "denovo". We choose here the reference based assembly for
# the downstream part.
assembly_for_phylogeny: "reference"

# Produce both assembly strategies by default. We may set one to False if not needed. We propose
# to construct both assamblies but use one of them for the downstream part (the refreence based one).
run_denovo_assembly: True
run_reference_assembly: True

# Optional user choices. Default is False for all.
skip_fastQC: False
skip_preprocessing: False

# fastp parameters. fastp replaces Trimmomatic from the previous workflow.
fastp:
  adapter_fasta: "resources/adapters/TruSeq3-PE.fa"
  extra: "--detect_adapter_for_pe --cut_front --cut_tail --cut_window_size 4 --cut_mean_quality 20 --length_required 50"

# BWA-MEM2 mapping parameters. BWA-MEM2 replaces Bowtie2 from the previous workflow.
bwa_mem2:
  extra: ""

# Allowing the user to choose a minimum depth for samtools consensus
consensus:
  min_depth: 5

# SPAdes de novo assembly parameters.
spades:
  extra: "--careful --phred-offset 33"

# RagTag scaffolding parameters. RagTag orders and orients de novo contigs against the reference
# so that each sample is represented by one scaffolded genome before MSA.
ragtag:
  extra: ""

# Sliding-window variability parameters.
variability:
  window_size: 500
  step_size: 50
  ignore_gaps: True